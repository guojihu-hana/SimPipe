[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpipe"
version = "0.1.0"
description = "LLM training pipeline parallelism simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "click>=8.1",
]

[project.optional-dependencies]
web = ["flask>=2.3"]
dev = ["pytest>=7.4", "flask>=2.3"]

[project.scripts]
simpipe = "simpipe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["simpipe*"]

[tool.setuptools.package-data]
"simpipe.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
