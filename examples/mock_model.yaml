# Default demo: synthetic pipeline with a layer pattern.
#
# - pattern ET*32L = embedding + 32 transformer layers + head ("X*N" repeats)
# - per-type times in ms: T forward = 1 ms, F : B : W = 1 : 1 : 1
#   (backward_ms defaults to forward_ms, weight_ms to backward_ms, E/L to 0)
# - 32 layers / pp_size 8 -> 4 layers per stage -> stage F = 4 ms
# - p2p_latency_ms 0.4 ms = 10% of a stage forward (communication)
# - batch: pack with every microbatch at the reference length (scale 1.0);
#   edit the per-microbatch rows in the UI to make them uneven
schedule: 1f1b
profiled_data: true
time_limit: 20000000

model:
  name: mock_model
  num_layers: 32
  pattern: ET*32L
  forward_ms:
    T: 1.0

# One multimodal encoder + decoder around the backbone (both are models
# themselves; see examples/multimodal.yaml for every placement option).
encoders:
- name: encoder1
  model:
    name: mock_model
    num_layers: 4
    pattern: T*4
    forward_ms:
      T: 0.5
  placement: first_stage

decoders:
- name: decoder1
  model:
    name: mock_model
    num_layers: 4
    pattern: T*4
    forward_ms:
      T: 0.5
  placement: last_stage

parallel:
  pp_size: 8
  micro_batch_num: 16

hardware:
  p2p_latency_ms: 0.4      # cross-stage transfer = 10% of stage forward time

# Variable-length microbatches: exactly ONE of microbatches / time_scales,
# sized to micro_batch_num.  Every row at the reference seq_len (4096) is a
# 1.0x scale, so this default behaves like a uniform batch; alternatively
# "time_scales: [1, 1.2, ...]" gives direct per-microbatch multipliers.
batch:
  mode: pack               # pack: concat (varlen kernels) | pad: pad to max
  microbatches:
  - [4096]
  - [4096]
  - [4096]
  - [4096]
  - [4096]
  - [4096]
  - [4096]
  - [4096]
  - [4096]
  - [4096]
  - [4096]
  - [4096]
  - [4096]
  - [4096]
  - [4096]
  - [4096]
